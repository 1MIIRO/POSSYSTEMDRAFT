<!DOCTYPE html>
<html>
<head>
    <title>Admin - Employees</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_employees.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- SIDEBAR -->
<div id="sidebar" class="sidebar">
    <div class="p-3">
        <h5>{{ user.personal_name }}</h5>
        <p>{{ user.job_desc }}</p>
    </div>
    <ul class="list-unstyled ps-3">
        <li>
            <a href="{{ url_for('dashboard') }}">Point_of_sales</a>
        </li>
        <li>
            <a href="{{ url_for('activity_billing_queue') }}">Activity</a>
        </li>
        <li>
            <a href="{{ url_for('audit_logs') }}">Audit logs</a>
        </li>
        <li>
            <a href="{{ url_for('product_inventory') }}">Inventory</a>
        </li>
        <li>
            <a href="{{ url_for('admin_employee') }}">Admin Employees</a> <!-- NEW LINK -->
        </li>
        <li><a href="#">Teams</a></li>
        <li><a href="#">Settings</a></li>
    </ul>
</div>

<!-- TOP BAR -->
<div class="top-bar d-flex align-items-center">
    <div id="menuToggle" class="menu-icon">&#9776;</div>
    <div class="date-box ms-3 top-bar-item">
       <button class="icon-button">
            <img src="{{ url_for('static', filename='images/calendar_icon.jpg') }}" 
                alt="date_icon" 
                class="icon-img">
       </button>
      <span id="dateText">--/--/----</span>
    </div>

    <div class="time-box ms-3 top-bar-item">
        <button class="icon-button">
            <img src="{{ url_for('static', filename='images/clock_icon.jpg') }}" 
                alt="date_icon" 
                class="icon-img">
       </button>
        <span id="timeText">--:--:--</span>
    </div>
</div>

<!-- CONTENT AREA -->
<div class="content" id="content">
    <div class="form-container">
        <h1>Add New Employee</h1>

        <!-- Username -->
        <div class="form-group">
            <label>Username:</label>
            <div class="button-group">
                <input id="username" placeholder="Enter username">
                <button onclick="saveField('username')" class="btn-save">Save</button>
            </div>
        </div>

        <!-- Personal Name -->
        <div class="form-group">
            <label>Personal Name:</label>
            <div class="button-group">
                <input id="personal_name" placeholder="Enter personal name">
                <button onclick="saveField('personal_name')" class="btn-save">Save</button>
            </div>
        </div>

        <!-- Password -->
        <div class="form-group">
            <label>Password:</label>
            <div class="button-group">
                <input id="user_password" type="password" placeholder="Enter password">
                <button onclick="saveField('user_password')" class="btn-save">Save</button>
            </div>
        </div>

        <!-- Job Description -->
        <div class="form-group">
            <label>Job Desc:</label>
            <div class="button-group">
                <input id="job_desc" placeholder="Enter job description">
                <button onclick="saveField('job_desc')" class="btn-save">Save</button>
            </div>
        </div>

        <!-- User Groups -->
        <div class="form-group">
            <label>User Groups:</label>
            <select id="groups" multiple>
                {% for group in groups %}
                <option value="{{ group.USER_GROUPS_number }}">{{ group.USER_GROUPS }}</option>
                {% endfor %}
            </select>
            <button onclick="saveGroups()" class="btn-save" style="width: 100%; margin-top: 10px;">Save Groups</button>
        </div>

        <!-- Submit Button -->
        <button class="submit-btn" onclick="submitAll()">Submit Employee</button>
    </div>
</div>

<script>
    // DATE & TIME UPDATE
    function updateDateTime() {
        const now = new Date();
        document.getElementById('dateText').textContent = now.toLocaleDateString();
        document.getElementById('timeText').textContent = now.toLocaleTimeString();
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();

    // SIDEBAR TOGGLE
    const sidebar = document.getElementById('sidebar');
    const menuToggle = document.getElementById('menuToggle');
    const content = document.getElementById('content');
    const topBar = document.querySelector('.top-bar');
    const topBarItems = document.querySelectorAll('.top-bar-item');

    menuToggle.addEventListener('click', function() {
        sidebar.classList.toggle('active');
        content.classList.toggle('shifted');
        topBar.classList.toggle('shifted');
        
        topBarItems.forEach(el => {
            el.classList.toggle('shifted-left');
        });
    });

    // CLOSE SIDEBAR ON CLICK
    document.addEventListener('click', function(event) {
        if (!sidebar.contains(event.target) && !menuToggle.contains(event.target)) {
            sidebar.classList.remove('active');
            content.classList.remove('shifted');
            topBar.classList.remove('shifted');
            
            topBarItems.forEach(el => {
                el.classList.remove('shifted-left');
            });
        }
    });

    // EMPLOYEE FORM LOGIC
    let tempData = {};
    let tempGroups = [];

    function saveField(fieldId) {
        tempData[fieldId] = document.getElementById(fieldId).value;
        alert(fieldId + " saved temporarily.");
    }

    function saveGroups() {
        tempGroups = Array.from(document.getElementById("groups").selectedOptions).map(o => o.value);
        alert("Groups saved temporarily: " + tempGroups.join(", "));
    }

    function submitAll() {
        if (!tempData.username || !tempData.personal_name || !tempData.user_password || !tempData.job_desc) {
            alert("Please fill and save all fields before submitting.");
            return;
        }

        fetch('/add_employee', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                user_name: tempData.username,
                personal_name: tempData.personal_name,
                user_password: tempData.user_password,
                job_desc: tempData.job_desc,
                group_ids: tempGroups
            })
        })
        .then(res => res.json())
        .then(data => {
            if(data.success){
                alert("Employee added successfully!");
                location.reload();
            } else {
                alert("Error: " + data.error);
            }
        })
        .catch(err => alert("Request failed: " + err));
    }
</script>

</body>
</html>
