 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN CATEGORY</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='product_inventory.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .btn-icon {
            width: 20px;
            height: 20px;
            margin-right: 8px;
        }

        .search-container {
            transition: margin 0.3s ease;
        }

        /* SHIFT CLASSES */
        .shifted-left { margin-left: 200px; }
        .shifted-right { margin-right: 25%; } /* matches order panel width */
        .shifted-left-time, .shifted-right-time { transition: margin 0.3s ease; }

    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div id="sidebar" class="sidebar">
        <div class="p-3">
            <h5>{{ user.personal_name }}</h5>
            <p>{{ user.job_desc }}</p>
        </div>
        <ul class="list-unstyled ps-3">
            <li>
                <a href="{{ url_for('dashboard') }}">Point_of_sales</a>
            </li>
            <li>
                <a href="{{ url_for('activity_billing_queue') }}">Activity</a>
            </li>
            <li>
                <a href="{{ url_for('audit_logs') }}">Audit logs</a>
            </li>
            <li>
                <a href="{{ url_for('product_inventory') }}">Inventory</a>
            </li>
            <li>
                <a href="{{ url_for('admin_employee') }}">Admin Employees</a> <!-- NEW LINK -->
            </li>
            <li><a href="#">Teams</a></li>
            <li><a href="#">Settings</a></li>
        </ul>
    </div>

    <!-- ORDER PANEL -->
    <div id="orderContainer" class="order-container">
        
    </div>

    <!-- TOP BAR -->
    <div class="top-bar d-flex align-items-center">
        <div id="menuToggle" class="menu-icon">&#9776;</div>
        <div class="date-box ms-3 top-bar-item">
           <button class="icon-button">
                <img src="{{ url_for('static', filename='images/calendar_icon.jpg') }}" 
                    alt="date_icon" 
                    class="icon-img">
           </button>
          <span id="dateText">--/--/----</span>
        </div>

        <div class="time-box ms-3 top-bar-item">
            <button class="icon-button">
                <img src="{{ url_for('static', filename='images/clock_icon.jpg') }}" 
                    alt="date_icon" 
                    class="icon-img">
           </button>
            <span id="timeText">--:--:--</span>
        </div>
        <div id="orderToggle" class="ms-auto open-order top-bar-item">Open Order</div>
    </div>

    <!-- BUTTON CONTAINER AS HORIZONTAL NAV -->
    <div id="buttonsContainer" class="buttons-container">
       <button class="dashboard-btn1">ADMIN#1</button>
	   <button class="dashboard-btn2">ADMIN#2</button> 
	   <button class="dashboard-btn3">ADMIN#3</button>
	   <button class="dashboard-btn4">ADMIN#4</button>
    </div>

    <!-- SEARCH BAR -->
    <div id="searchContainer" class="search-container mt-3">
        <div class="input-group">
            <input type="text" id="searchInput" placeholder="Search for something sweet on your mind" class="form-control">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
        </div>
    </div>
    
    <!-- BIG DISPLAY SCREEN -->
    <div id="bigDisplay" class="big-display">
        <!-- content goes here -->
    </div>

    <!-- SCRIPT -->
    <script>
    // DATE & TIME
            function updateDateTime() {
            const now = new Date();
            document.getElementById('dateText').textContent = now.toLocaleDateString();
            document.getElementById('timeText').textContent = now.toLocaleTimeString();
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        // ELEMENTS
        const orderToggle = document.getElementById('orderToggle');
        const sidebar = document.getElementById('sidebar');
        const orderContainer = document.getElementById('orderContainer');
        const menuToggle = document.getElementById('menuToggle');
        const buttonsContainer = document.getElementById('buttonsContainer');
        const searchContainer = document.getElementById('searchContainer');
        const bigDisplay = document.getElementById('bigDisplay');
        const buttons = document.querySelectorAll('.dashboard-btn');
        const topBarItems = document.querySelectorAll('.top-bar-item');
        let tempOrderItems = [];

        // SHIFT FUNCTION
        function shiftUI(shiftSidebar, shiftOrder) {
            if (shiftSidebar) {
                buttonsContainer.classList.add('shifted-left');
                searchContainer.classList.add('shifted-left');
                topBarItems.forEach(el => el.classList.add('shifted-left-time'));
            } else {
                buttonsContainer.classList.remove('shifted-left');
                searchContainer.classList.remove('shifted-left');
                topBarItems.forEach(el => el.classList.remove('shifted-left-time'));
            }

            if (shiftOrder) {
                buttonsContainer.classList.add('shifted-right');
                searchContainer.classList.add('shifted-right');
                productDisplay.classList.add('shifted-right');
                topBarItems.forEach(el => el.classList.add('shifted-right-time'));
            } else {
                buttonsContainer.classList.remove('shifted-right');
                searchContainer.classList.remove('shifted-right');
                productDisplay.classList.remove('shifted-right');
                topBarItems.forEach(el => el.classList.remove('shifted-right-time'));
            }

            if (shiftSidebar || shiftOrder) {
                buttons.forEach(btn => btn.style.flex = '0 1 auto');
            } else {
                buttons.forEach(btn => btn.style.flex = '1');
            }
        }

        // SIDEBAR TOGGLE
        menuToggle.addEventListener('click', function() {
            orderContainer.classList.remove("active"); 
            orderToggle.textContent = "Open Order";
            orderToggle.classList.remove("close-order");
            orderToggle.classList.add("open-order");

            sidebar.classList.toggle('active');
            shiftUI(sidebar.classList.contains('active'), false);
        });
    
        // ORDER TOGGLE
        orderToggle.addEventListener('click', () => {
            if (orderToggle.textContent === "Open Order") {
                orderContainer.classList.add("active");
                orderToggle.textContent = "Close Order";
                orderToggle.classList.remove("open-order");
                orderToggle.classList.add("close-order");

                sidebar.classList.remove('active');
                shiftUI(false, true);
            } else {
                orderContainer.classList.remove("active");
                orderToggle.textContent = "Open Order";
                orderToggle.classList.remove("close-order");
                orderToggle.classList.add("open-order");

                shiftUI(false, false);

               
          // ===== RESET DISPLAY SCREEN 1 =====
        orderItems.innerHTML = "";  // clears all selected products

        // ===== RESET TEMP JSON =====
        tempOrderItems = [];

        // ===== RESET SUBTOTAL =====
        document.querySelector('.subtotal-amount').textContent = '$0.00';
            }
        });

        // CLOSE SIDEBAR ON CLICK
        sidebar.addEventListener('click', function () {
            sidebar.classList.remove('active');
            shiftUI(false, false);
        });

         // Track button click state
        let adminadduser=0;

        document.querySelector('.dashboard-btn1').addEventListener('click', () => {
                const bigDisplay = document.getElementById('bigDisplay');

                // Increment counter
                adminadduser++;

                // Triple-click hides everything
                if (adminadduser === 3) {
                    bigDisplay.innerHTML = '';
                    bigDisplay.style.display = 'none';
                    adminadduser = 0;
                    return;
                }


                bigDisplay.innerHTML = `
                <div id="addInventoryWrapper">
					<!-- CONTENT AREA -->
					<div class="content" id="content">
						<div class="form-container">
							<h1>Add New Employee</h1>

							<!-- Username -->
							<div class="form-group">
								<label>Username:</label>
								<div class="button-group">
									<input id="username" placeholder="Enter username">
									<button onclick="saveField('username')" class="btn-save">Save</button>
								</div>
							</div>

							<!-- Personal Name -->
							<div class="form-group">
								<label>Personal Name:</label>
								<div class="button-group">
									<input id="personal_name" placeholder="Enter personal name">
									<button onclick="saveField('personal_name')" class="btn-save">Save</button>
								</div>
							</div>

							<!-- Password -->
							<div class="form-group">
								<label>Password:</label>
								<div class="button-group">
									<input id="user_password" type="password" placeholder="Enter password">
									<button onclick="saveField('user_password')" class="btn-save">Save</button>
								</div>
							</div>

							<!-- Job Description -->
							<div class="form-group">
								<label>Job Desc:</label>
								<div class="button-group">
									<input id="job_desc" placeholder="Enter job description">
									<button onclick="saveField('job_desc')" class="btn-save">Save</button>
								</div>
							</div>

							<!-- User Groups -->
							<div class="form-group">
								<label>User Groups:</label>
								<select id="groups" multiple>
									{% for group in groups %}
									<option value="{{ group.USER_GROUPS_number }}">{{ group.USER_GROUPS }}</option>
									{% endfor %}
								</select>
								<button onclick="saveGroups()" class="btn-save" style="width: 100%; margin-top: 10px;">Save Groups</button>
							</div>

							<!-- Submit Button -->
							<button class="submit-btn" onclick="submitAll()">Submit Employee</button>
						</div>
					</div>

                `;

                bigDisplay.style.display = 'block';
                   // EMPLOYEE FORM LOGIC
    let tempData = {};
    let tempGroups = [];

    function saveField(fieldId) {
        tempData[fieldId] = document.getElementById(fieldId).value;
        alert(fieldId + " saved temporarily.");
    }

    function saveGroups() {
        tempGroups = Array.from(document.getElementById("groups").selectedOptions).map(o => o.value);
        alert("Groups saved temporarily: " + tempGroups.join(", "));
    }

    function submitAll() {
        if (!tempData.username || !tempData.personal_name || !tempData.user_password || !tempData.job_desc) {
            alert("Please fill and save all fields before submitting.");
            return;
        }

        fetch('/add_employee', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                user_name: tempData.username,
                personal_name: tempData.personal_name,
                user_password: tempData.user_password,
                job_desc: tempData.job_desc,
                group_ids: tempGroups
            })
        })
        .then(res => res.json())
        .then(data => {
            if(data.success){
                alert("Employee added successfully!");
                location.reload();
            } else {
                alert("Error: " + data.error);
            }
        })
        .catch(err => alert("Request failed: " + err));
    }

            });
       
        document.querySelector('.dashboard-btn3').addEventListener('click', () => {

                const bigDisplay = document.getElementById('bigDisplay');
                bigDisplay.innerHTML = '';
                bigDisplay.style.display = 'block';

                const table = document.createElement('table');
                table.classList.add('table', 'table-bordered');
                table.style.width = '100%';

        
            });
 
        let productEditorClickCount = 0;

        document.querySelector('.dashboard-btn4').addEventListener('click', async () => {
            const bigDisplay = document.getElementById('bigDisplay');
            productEditorClickCount++;

            // Double-click clears display
            if (productEditorClickCount === 2) {
                bigDisplay.innerHTML = '';
                bigDisplay.style.display = 'none';
                productEditorClickCount = 0;
                return;
            }

            bigDisplay.innerHTML = '';
            bigDisplay.style.display = 'flex';
            bigDisplay.style.flexWrap = 'wrap';
            bigDisplay.style.justifyContent = 'center';
            bigDisplay.style.gap = '15px';

        });

       document.querySelector('.dashboard-btn2').addEventListener('click', async () => {
    const bigDisplay = document.getElementById('bigDisplay');

    bigDisplay.style.display = 'block';
    bigDisplay.innerHTML = 'Loading...';

    const res = await fetch('/get_user_activity');
    const data = await res.json();

    let html = `
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>User ID</th>
                    <th>Name</th>
                    <th>Username</th>
                    <th>Logins</th>
                    <th>First Login</th>
                    <th>Last Login</th>
                </tr>
            </thead>
            <tbody>
    `;

    data.activities.forEach(r => {
        html += `
            <tr>
                <td>${r.user_id ?? ''}</td>
                <td>${r.name ?? ''}</td>
                <td>${r.username ?? ''}</td>
                <td>${r.login_count ?? 0}</td>
                <td>${r.first_login ?? ''}</td>
                <td>${r.last_login ?? ''}</td>
            </tr>
        `;
    });

    html += `</tbody></table>`;

    bigDisplay.innerHTML = html;
});

    </script>

</body>
</html>
